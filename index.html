<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimatepoop</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: radial-gradient(circle at top, #1d2a3a 0%, #090d14 40%, #000000 100%);
        color: #eaeef7;
      }

      .app {
        width: min(440px, 92vw);
        padding: 30px 24px;
        border-radius: 28px;
        background: rgba(12, 17, 25, 0.8);
        border: 1px solid rgba(255, 86, 86, 0.35);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 30px rgba(255, 72, 72, 0.18), 0 25px 50px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 42px;
        color: #ff5a5a;
        text-shadow: 0 0 15px rgba(255, 90, 90, 0.45);
      }

      .subtitle {
        margin: 0 0 22px;
        color: #ff9d9d;
        font-size: 22px;
        font-weight: 700;
      }

      .button-stack {
        display: grid;
        gap: 12px;
      }

      button {
        border: 1px solid rgba(255, 120, 120, 0.35);
        border-radius: 16px;
        padding: 16px 18px;
        background: linear-gradient(135deg, #3b0f14, #6a1117);
        color: #ffd7d7;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, border-color 0.15s ease;
        box-shadow: 0 0 16px rgba(255, 90, 90, 0.18);
      }

      button:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 150, 150, 0.7);
      }

      button:active {
        transform: translateY(0);
      }

      .b1:disabled {
        background: #1f1a1b;
        opacity: 0.7;
        cursor: not-allowed;
        box-shadow: none;
        border-color: rgba(255, 125, 125, 0.15);
      }

      .response {
        min-height: 28px;
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255, 92, 92, 0.08);
        border: 1px solid rgba(255, 120, 120, 0.2);
        color: #ffd4d4;
        font-size: 16px;
      }

      .link {
        display: inline-block;
        margin-top: 20px;
        color: #ffb0b0;
        text-decoration: none;
        font-weight: 700;
      }

      .link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="app">
      <h1>Yo, Human! 👽</h1>
      <p class="subtitle">On a scale of pizza to chaos, how's it going?</p>

      <div class="button-stack">
        <button id="dood" class="b1">🔥 Living My Best Life</button>
        <button id="bleh" class="b1">😐 Meh</button>
        <button id="gad" class="b1">💀 Existential Dread</button>
        <button id="dna" class="b1">🤐 None of Your Business</button>

      </div>
      

      <div class="response" id="myanswer"></div>
      <div class="response" id="myanswer2"></div>
      <div class="response" id="myanswer3"></div>
      <div class="response" id="myanswer4"></div>

      <a class="link" href="https://theuselessweb.com/" target="_blank" rel="noreferrer">
        Link for more
      </a>
    </div>

    <script>
      console.log("\n👀 Congrats on opening the console, inspector! Want a cookie?");
      const buttons = document.querySelectorAll(".b1");
      const button = document.getElementById("dood");
      const button2 = document.getElementById("bleh");
      const button3 = document.getElementById("gad");
      const button4 = document.getElementById("dna");
      const ma = document.getElementById("myanswer");
      const ma2 = document.getElementById("myanswer2");
      const ma3 = document.getElementById("myanswer3");
      const ma4 = document.getElementById("myanswer4");

      buttons.forEach((buttonItem) => {
        buttonItem.addEventListener("click", function () {
          buttons.forEach((otherButton) => {
            if (otherButton !== buttonItem) {
              otherButton.disabled = true;
            }
          });

          buttonItem.disabled = true;

          if (buttonItem === button) {
            ma.textContent = "POG! We vibing together now! 🎉";
          }
          if (buttonItem === button2) {
            ma2.textContent = "Meh is a vibe, I guess we're both confused together 🤷";
          }
          if (buttonItem === button3) {
            ma3.textContent = "Yikes. Want a virtual hug? Or a meme? Memes fix everything ✨";
          }
        });
      });

      button4.addEventListener("click", function () {
        ma4.textContent = "I RESPECT THE SILENCE. You're too cool for words anyway 😎";
        buttons.forEach((btn) => {
          btn.disabled = true;
        });
      });
    </script>
  </body>
</html>
